<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单管理后台 · 鲜荔直订</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #F5F5F0; color: #2C2C2A; min-height: 100vh; }
    .header { background: #fff; border-bottom: 0.5px solid #e8e0d4; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-icon { width: 28px; height: 28px; background: #D85A30; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 500; }
    .header-title { font-size: 15px; font-weight: 500; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .header-btn { background: none; border: 0.5px solid #D3D1C7; border-radius: 6px; padding: 5px 12px; font-size: 12px; color: #888780; cursor: pointer; text-decoration: none; display: inline-block; font-family: inherit; }
    .header-btn:hover { background: #F1EFE8; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px 24px; }

    /* Stats */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: #fff; border-radius: 12px; border: 0.5px solid #e8e0d4; padding: 16px 18px; }
    .stat-label { font-size: 12px; color: #888780; margin-bottom: 6px; }
    .stat-value { font-size: 22px; font-weight: 500; color: #2C2C2A; }
    .stat-value.highlight { color: #D85A30; }
    .stat-value.success { color: #3B6D11; }

    /* Toolbar */
    .toolbar { background: #fff; border-radius: 12px; border: 0.5px solid #e8e0d4; padding: 14px 18px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .search-box { flex: 1; min-width: 200px; position: relative; }
    .search-box input { width: 100%; border: 0.5px solid #D3D1C7; border-radius: 8px; padding: 8px 12px 8px 32px; font-size: 13px; outline: none; background: #fff; font-family: inherit; }
    .search-box input:focus { border-color: #D85A30; }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #B4B2A9; font-size: 14px; pointer-events: none; }
    .filter-select { border: 0.5px solid #D3D1C7; border-radius: 8px; padding: 8px 10px; font-size: 13px; color: #5F5E5A; background: #fff; outline: none; cursor: pointer; font-family: inherit; }
    .filter-select:focus { border-color: #D85A30; }
    .date-input { border: 0.5px solid #D3D1C7; border-radius: 8px; padding: 7px 10px; font-size: 13px; color: #5F5E5A; background: #fff; outline: none; font-family: inherit; }
    .toolbar-btn { background: #fff; border: 0.5px solid #D3D1C7; border-radius: 8px; padding: 7px 14px; font-size: 13px; color: #5F5E5A; cursor: pointer; display: flex; align-items: center; gap: 4px; font-family: inherit; }
    .toolbar-btn:hover { background: #F1EFE8; }
    .toolbar-btn.primary { border-color: #D85A30; color: #D85A30; }
    .toolbar-btn.primary:hover { background: #FFF0E8; }

    /* Table */
    .table-wrap { background: #fff; border-radius: 12px; border: 0.5px solid #e8e0d4; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead { background: #FAF9F5; }
    th { padding: 10px 14px; text-align: left; font-weight: 500; color: #888780; font-size: 12px; border-bottom: 0.5px solid #e8e0d4; white-space: nowrap; user-select: none; cursor: pointer; }
    th:hover { color: #D85A30; }
    th .sort-arrow { font-size: 10px; margin-left: 2px; }
    td { padding: 11px 14px; border-bottom: 0.5px solid #F1EFE8; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: #FFFAF5; }
    .order-no { font-weight: 500; color: #D85A30; font-size: 12px; }
    .order-time { font-size: 12px; color: #888780; }
    .customer-name { font-weight: 500; color: #2C2C2A; }
    .customer-phone { font-size: 12px; color: #888780; }
    .address-cell { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: #5F5E5A; }
    .items-cell { font-size: 12px; color: #5F5E5A; max-width: 180px; }
    .total-cell { font-weight: 500; color: #D85A30; white-space: nowrap; }

    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; }
    .status-badge:hover { opacity: 0.8; }
    .status-待付款 { background: #FAEEDA; color: #854F0B; }
    .status-已付款 { background: #EAF3DE; color: #3B6D11; }
    .status-已发货 { background: #E6F1FB; color: #185FA5; }
    .status-已完成 { background: #F1EFE8; color: #888780; }
    .status-已取消 { background: #FDE8E8; color: #A32D2D; }

    .action-btns { display: flex; gap: 4px; }
    .action-btn { background: none; border: 0.5px solid #D3D1C7; border-radius: 6px; padding: 3px 8px; font-size: 11px; color: #5F5E5A; cursor: pointer; font-family: inherit; transition: background 0.15s; }
    .action-btn:hover { background: #F1EFE8; }
    .action-btn.danger { border-color: #E24B4A; color: #E24B4A; }
    .action-btn.danger:hover { background: #FDE8E8; }

    /* Empty */ 
    .empty-state { text-align: center; padding: 60px 20px; color: #B4B2A9; font-size: 14px; }

    /* Pagination */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 6px; padding: 14px 16px; border-top: 0.5px solid #F1EFE8; flex-wrap: wrap; }
    .page-btn { background: #fff; border: 0.5px solid #D3D1C7; border-radius: 6px; padding: 4px 10px; font-size: 12px; color: #5F5E5A; cursor: pointer; font-family: inherit; transition: background 0.15s; }
    .page-btn:hover:not(:disabled) { background: #F1EFE8; }
    .page-btn.active { background: #D85A30; color: #fff; border-color: #D85A30; }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .page-info { font-size: 12px; color: #888780; margin: 0 8px; }

    /* Detail Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 16px; width: 92%; max-width: 540px; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; animation: modalIn 0.2s ease; }
    @keyframes modalIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header { padding: 16px 20px; border-bottom: 0.5px solid #e8e0d4; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .modal-title { font-size: 15px; font-weight: 500; }
    .modal-close { background: #F1EFE8; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 14px; color: #5F5E5A; display: flex; align-items: center; justify-content: center; font-family: inherit; }
    .modal-body { flex: 1; overflow-y: auto; padding: 20px; }
    .detail-section { margin-bottom: 18px; }
    .detail-section-title { font-size: 12px; color: #888780; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 0.5px solid #F1EFE8; }
    .detail-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; }
    .detail-label { color: #888780; }
    .detail-value { color: #2C2C2A; font-weight: 500; text-align: right; max-width: 60%; word-break: break-all; }
    .detail-item { background: #FFF7F0; border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; font-size: 12px; color: #5F5E5A; display: flex; justify-content: space-between; }
    .status-select { border: 0.5px solid #D3D1C7; border-radius: 8px; padding: 8px 12px; font-size: 13px; color: #2C2C2A; background: #fff; outline: none; font-family: inherit; margin-top: 14px; width: 100%; }
    .status-select:focus { border-color: #D85A30; }
    .save-status-btn { width: 100%; background: #D85A30; color: #fff; border: none; border-radius: 10px; padding: 11px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; transition: background 0.15s; margin-top: 10px; }
    .save-status-btn:hover { background: #993C1D; }

    /* Toast */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #3B6D11; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 500; transition: transform 0.3s; white-space: nowrap; }
    .toast.error-toast { background: #A32D2D; }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Price Modal */
    .price-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; align-items: center; justify-content: center; }
    .price-overlay.open { display: flex; }
    .price-modal { background: #fff; border-radius: 16px; width: 92%; max-width: 420px; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; animation: modalIn 0.2s ease; }
    .price-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 0.5px solid #F1EFE8; }
    .price-row:last-child { border-bottom: none; }
    .price-label { font-size: 14px; color: #2C2C2A; font-weight: 500; }
    .price-input-wrap { display: flex; align-items: center; gap: 4px; }
    .price-input { width: 80px; border: 0.5px solid #D3D1C7; border-radius: 8px; padding: 6px 8px; font-size: 14px; text-align: right; outline: none; font-family: inherit; }
    .price-input:focus { border-color: #D85A30; }
    .price-unit { font-size: 13px; color: #888780; }
    .price-body { flex: 1; overflow-y: auto; padding: 20px; }
    .price-footer { padding: 14px 20px; border-top: 0.5px solid #e8e0d4; display: flex; gap: 10px; }
    .price-save-btn { flex: 1; background: #D85A30; color: #fff; border: none; border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; transition: background 0.15s; }
    .price-save-btn:hover { background: #993C1D; }
    .price-save-btn:disabled { background: #ccc; cursor: not-allowed; }
    .price-cancel-btn { flex: 1; background: #fff; border: 0.5px solid #D3D1C7; border-radius: 10px; padding: 11px; font-size: 14px; color: #5F5E5A; cursor: pointer; font-family: inherit; transition: background 0.15s; }
    .price-cancel-btn:hover { background: #F1EFE8; }
    .price-tip { font-size: 12px; color: #888780; margin-top: 12px; line-height: 1.6; }

    @media (max-width: 768px) {
      .container { padding: 12px; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .stats-row .stat-card:last-child { grid-column: span 2; }
      table { font-size: 12px; }
      th, td { padding: 8px 8px; }
      .address-cell { display: none; }
      .modal { width: 98%; }
    }
    @media (max-width: 480px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
      .toolbar { padding: 10px 12px; gap: 8px; }
      .date-input { width: 100%; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="header-icon">管</div>
    <span class="header-title">荔枝订单管理</span>
  </div>
  <div class="header-right">
    <span style="font-size:12px;color:#888780" id="orderCount"></span>
    <a class="header-btn" href="lychee-order.html" target="_blank">🛒 客户端</a>
    <button class="header-btn" onclick="openPriceModal()">💰 价格管理</button>
    <button class="header-btn" onclick="exportCSV()">📥 导出 CSV</button>
    <button class="header-btn" onclick="loadOrders();renderTable();showToast('已刷新')">🔄 刷新</button>
  </div>
</header>

<div class="container">
  <div class="stats-row" id="statsRow"></div>

  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索订单号、收件人、商品、手机号..." oninput="onSearchInput()">
    </div>
    <select class="filter-select" id="statusFilter" onchange="currentPage=1;renderTable()">
      <option value="">全部状态</option>
      <option value="待付款">待付款</option>
      <option value="已付款">已付款</option>
      <option value="已发货">已发货</option>
      <option value="已完成">已完成</option>
      <option value="已取消">已取消</option>
    </select>
    <input type="date" class="date-input" id="dateFrom" onchange="currentPage=1;renderTable()" title="开始日期">
    <span style="font-size:12px;color:#888780">至</span>
    <input type="date" class="date-input" id="dateTo" onchange="currentPage=1;renderTable()" title="结束日期">
    <button class="toolbar-btn" onclick="clearFilters()">✖ 清除筛选</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('orderNo')">订单号 <span class="sort-arrow" id="arrow-orderNo"></span></th>
          <th onclick="sortBy('time')">下单时间 <span class="sort-arrow" id="arrow-time"></span></th>
          <th>收件人</th>
          <th class="hide-mobile">地址</th>
          <th>商品明细</th>
          <th>合计</th>
          <th>状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none">没有找到匹配的订单</div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">订单详情</span>
      <button class="modal-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>

<!-- Price Management Modal -->
<div class="price-overlay" id="priceOverlay">
  <div class="price-modal">
    <div class="modal-header">
      <span class="modal-title">价格管理</span>
      <button class="modal-close" onclick="closePriceModal()">✕</button>
    </div>
    <div class="price-body">
      <div class="price-row">
        <span class="price-label">🍒 桂味（元/斤）</span>
        <div class="price-input-wrap">
          <input type="number" class="price-input" id="priceGuiwei" min="0" step="0.01">
          <span class="price-unit">元/斤</span>
        </div>
      </div>
      <div class="price-row">
        <span class="price-label">🍒 糯米糍（元/斤）</span>
        <div class="price-input-wrap">
          <input type="number" class="price-input" id="priceNuomici" min="0" step="0.01">
          <span class="price-unit">元/斤</span>
        </div>
      </div>
      <div class="price-row">
        <span class="price-label">🍒 仙进奉（元/斤）</span>
        <div class="price-input-wrap">
          <input type="number" class="price-input" id="priceXianjinfeng" min="0" step="0.01">
          <span class="price-unit">元/斤</span>
        </div>
      </div>
      <div class="price-tip" id="priceTip">
        💡 填写价格后点击保存，客户端页面刷新即自动同步。
      </div>
    </div>
    <div class="price-footer">
      <button class="price-cancel-btn" onclick="closePriceModal()">取消</button>
      <button class="price-save-btn" id="priceSaveBtn" onclick="savePrices()">💾 保存价格</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  const STORAGE_KEY = 'lychee_orders';
  const STATUS_LIST = ['待付款', '已付款', '已发货', '已完成', '已取消'];
  let allOrders = [];
  let filteredOrders = [];
  let currentPage = 1;
  const PAGE_SIZE = 15;
  let sortField = 'time';
  let sortAsc = false;
  let searchTimer = null;

  // ========== 价格配置 ==========
  // 方案 A（推荐）：GitHub Gist 免费 JSON API
  // 1. 访问 https://gist.github.com 创建 Gist
  // 2. 文件名：lychee-prices.json，内容：{"guiwei":49,"nuomici":68,"xianjinfeng":58}
  // 3. 创建后复制「Raw」链接，填入下面 GIST_RAW_URL
  const GIST_RAW_URL = '';  // ← 填你的 Gist Raw URL
  // 方案 B：Cloudflare Workers（免费，无需信用卡）
  const CF_WORKER_URL = '';  // ← 填你的 Worker URL

  let currentPrices = { guiwei: 49, nuomici: 68, xianjinfeng: 58 };

  function getPriceUrl() {
    return GIST_RAW_URL || CF_WORKER_URL || '';
  }

  // ========== 加载订单 ==========
  function loadOrders() {
    try {
      allOrders = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch(e) { allOrders = []; }
    allOrders.forEach((o, i) => {
      if (!o.status) o.status = '待付款';
      if (!o.items && o.cart) o.items = o.cart;
      o.totalNum = parseFloat(o.total) || 0;
    });
    saveOrders();
  }

  function saveOrders() {
    const toSave = allOrders.map(o => { const { totalNum, ...rest } = o; return rest; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  }

  function getFiltered() {
    const search = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    const status = document.getElementById('statusFilter').value;
    const dateFrom = document.getElementById('dateFrom').value;
    const dateTo = document.getElementById('dateTo').value;
    return allOrders.filter(o => {
      if (search) {
        const itemsName = (o.items || []).map(i => i.name || '').join(' ');
        const rName = (o.receiver && o.receiver.name) || '';
        const rPhone = (o.receiver && o.receiver.phone) || '';
        const rAddr = (o.receiver && (o.receiver.addr || o.receiver.address)) || '';
        const hay = [o.orderNo, o.time, rName, rPhone, rAddr, itemsName, (o.total || '')].join(' ').toLowerCase();
        if (!hay.includes(search)) return false;
      }
      if (status && o.status !== status) return false;
      if (dateFrom) { const d = (o.time || '').split(' ')[0]; if (d < dateFrom) return false; }
      if (dateTo) { const d = (o.time || '').split(' ')[0]; if (d > dateTo) return false; }
      return true;
    });
  }

  // ========== 统计 ==========
  function renderStats() {
    const total = allOrders.length;
    const totalRevenue = allOrders.filter(o => o.status !== '已取消').reduce((s, o) => s + (parseFloat(o.total) || 0), 0);
    const paidCount = allOrders.filter(o => ['已付款','已发货','已完成'].includes(o.status)).length;
    const pendingCount = allOrders.filter(o => o.status === '待付款').length;
    const today = new Date().toISOString().split('T')[0];
    const todayCount = allOrders.filter(o => (o.time || '').startsWith(today)).length;
    document.getElementById('statsRow').innerHTML =
      '<div class="stat-card"><div class="stat-label">全部订单</div><div class="stat-value">' + total + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">今日新增</div><div class="stat-value highlight">' + todayCount + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">待付款</div><div class="stat-value" style="color:#854F0B">' + pendingCount + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">已付款/已发货</div><div class="stat-value success">' + paidCount + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">累计成交额</div><div class="stat-value highlight">¥' + totalRevenue.toFixed(2) + '</div></div>';
    document.getElementById('orderCount').textContent = '共 ' + total + ' 单';
  }

  // ========== 渲染表格 ==========
  function renderTable() {
    filteredOrders = getFiltered();
    filteredOrders.sort((a, b) => {
      let va = a[sortField] || '', vb = b[sortField] || '';
      if (sortField === 'time') { if (!sortAsc) { const t = va; va = vb; vb = t; } }
      if (sortField === 'orderNo') { if (sortAsc) { const t = va; va = vb; vb = t; } }
      return va.toString().localeCompare(vb.toString());
    });
    document.querySelectorAll('.sort-arrow').forEach(el => el.textContent = '');
    const arrow = sortAsc ? '↑' : '↓';
    const arrowEl = document.getElementById('arrow-' + sortField);
    if (arrowEl) arrowEl.textContent = arrow;

    const totalPages = Math.max(1, Math.ceil(filteredOrders.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageOrders = filteredOrders.slice(start, start + PAGE_SIZE);

    if (!pageOrders.length) {
      document.getElementById('tableBody').innerHTML = '';
      document.getElementById('emptyState').style.display = 'block';
      document.querySelector('table').style.display = 'none';
    } else {
      document.getElementById('emptyState').style.display = 'none';
      document.querySelector('table').style.display = 'table';
      document.getElementById('tableBody').innerHTML = pageOrders.map((o, i) => {
        const gi = allOrders.indexOf(o);
        const itemsStr = (o.items || []).map(it => it.name + '×' + it.qty + '斤').join('、');
        const r = o.receiver || {};
        return '<tr>' +
          '<td><span class="order-no">' + (o.orderNo || '-') + '</span><br><span class="order-time">' + ((o.time||'').split(' ')[0]||'') + '</span></td>' +
          '<td><div class="customer-name">' + (r.name||'-') + '</div><div class="customer-phone">' + (r.phone||'-') + '</div></td>' +
          '<td class="address-cell" title="' + (r.addr||r.address||'') + '">' + (r.addr||r.address||'-') + '</td>' +
          '<td><div class="items-cell">' + itemsStr + '</div></td>' +
          '<td class="total-cell">¥' + parseFloat(o.total||0).toFixed(2) + '</td>' +
          '<td><select class="status-select-sm status-' + o.status + '" onchange="quickStatusChange(' + gi + ',this.value)"><option' + (o.status==='待付款'?' selected':'') + '>待付款</option><option' + (o.status==='已付款'?' selected':'') + '>已付款</option><option' + (o.status==='已发货'?' selected':'') + '>已发货</option><option' + (o.status==='已完成'?' selected':'') + '>已完成</option><option' + (o.status==='已取消'?' selected':'') + '>已取消</option></select></td>' +
          '<td><div class="action-btns"><button class="action-btn" onclick="showDetail(' + gi + ')">详情</button><button class="action-btn danger" onclick="deleteOrder(' + gi + ')">删除</button></div></td>' +
        '</tr>';
      }).join('');
    }
    renderPagination(totalPages);
    renderStats();
  }

  function renderPagination(totalPages) {
    if (totalPages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
    let html = '';
    html += '<button class="page-btn" onclick="goPage(1)" ' + (currentPage===1?'disabled':'') + '>首页</button>';
    html += '<button class="page-btn" onclick="goPage(' + (currentPage-1) + ')" ' + (currentPage===1?'disabled':'') + '>‹ 上一页</button>';
    let sp = Math.max(1, currentPage-2), ep = Math.min(totalPages, currentPage+2);
    if (sp > 1) html += '<span class="page-info">…</span>';
    for (let p = sp; p <= ep; p++) html += '<button class="page-btn ' + (p===currentPage?'active':'') + '" onclick="goPage(' + p + ')">' + p + '</button>';
    if (ep < totalPages) html += '<span class="page-info">…</span>';
    html += '<button class="page-btn" onclick="goPage(' + (currentPage+1) + ')" ' + (currentPage===totalPages?'disabled':'') + '>下一页 ›</button>';
    html += '<button class="page-btn" onclick="goPage(' + totalPages + ')" ' + (currentPage===totalPages?'disabled':'') + '>末页</button>';
    html += '<span class="page-info">共 ' + filteredOrders.length + ' 条</span>';
    document.getElementById('pagination').innerHTML = html;
  }

  window.goPage = function(p) {
    const tp = Math.max(1, Math.ceil(filteredOrders.length / PAGE_SIZE));
    if (p < 1 || p > tp) return;
    currentPage = p;
    renderTable();
    document.querySelector('.table-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  window.sortBy = function(field) {
    if (sortField === field) { sortAsc = !sortAsc; } 
    else { sortField = field; sortAsc = (field === 'orderNo'); }
    currentPage = 1;
    renderTable();
  };

  window.onSearchInput = function() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { currentPage = 1; renderTable(); }, 300);
  };

  window.clearFilters = function() {
    document.getElementById('searchInput').value = '';
    document.getElementById('statusFilter').value = '';
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value = '';
    currentPage = 1; sortField = 'time'; sortAsc = false;
    renderTable();
    showToast('已清除所有筛选条件');
  };

  // ========== 详情弹窗 ==========
  window.showDetail = function(idx) {
    const o = allOrders[idx]; if (!o) return;
    const r = o.receiver || {};
    const itemsHtml = (o.items || []).map(it => '<div class="detail-item"><span>' + it.name + ' × ' + it.qty + ' 斤</span><strong>¥' + ((it.price||0)*(it.qty||0)).toFixed(2) + '</strong></div>').join('');
    document.getElementById('detailBody').innerHTML =
      '<div class="detail-section"><div class="detail-section-title">📦 订单信息</div>' +
      '<div class="detail-row"><span class="detail-label">订单号</span><span class="detail-value">' + (o.orderNo||'-') + '</span></div>' +
      '<div class="detail-row"><span class="detail-label">下单时间</span><span class="detail-value">' + (o.time||'-') + '</span></div>' +
      '<div class="detail-row"><span class="detail-label">订单状态</span><span class="detail-value"><span class="status-badge status-' + o.status + '">' + o.status + '</span></span></div></div>' +
      '<div class="detail-section"><div class="detail-section-title">👤 收件人信息</div>' +
      '<div class="detail-row"><span class="detail-label">姓名</span><span class="detail-value">' + (r.name||'-') + '</span></div>' +
      '<div class="detail-row"><span class="detail-label">手机号</span><span class="detail-value">' + (r.phone||'-') + '</span></div>' +
      '<div class="detail-row"><span class="detail-label">收件地址</span><span class="detail-value">' + (r.addr||r.address||'-') + '</span></div>' +
      '<div class="detail-row"><span class="detail-label">备注</span><span class="detail-value">' + (r.remark||'-') + '</span></div></div>' +
      '<div class="detail-section"><div class="detail-section-title">🛒 商品明细</div>' +
      '<div class="detail-items">' + itemsHtml + '</div>' +
      '<div class="detail-row" style="margin-top:10px;padding-top:8px;border-top:0.5px solid #e8e0d4"><span class="detail-label" style="font-size:14px">合计</span><span class="detail-value" style="color:#D85A30;font-size:16px">¥' + parseFloat(o.total||0).toFixed(2) + '</span></div></div>' +
      '<div class="detail-section"><div class="detail-section-title">🔄 修改状态</div>' +
      '<select class="status-select" id="statusSelect">' + STATUS_LIST.map(s => '<option value="' + s + '" ' + (o.status===s?'selected':'') + '>' + s + '</option>').join('') + '</select>' +
      '<button class="save-status-btn" onclick="saveStatus(' + idx + ')">保存状态</button></div>';
    document.getElementById('detailModal').classList.add('open');
  };

  window.closeDetail = function() { document.getElementById('detailModal').classList.remove('open'); };
  window.saveStatus = function(idx) {
    allOrders[idx].status = document.getElementById('statusSelect').value;
    saveOrders(); closeDetail(); renderTable();
    showToast('状态已更新为：' + allOrders[idx].status);
  };
  window.quickStatusChange = function(idx, s) { allOrders[idx].status = s; saveOrders(); renderTable(); showToast('状态已更新为：' + s); };
  window.deleteOrder = function(idx) {
    if (!confirm('确认删除订单 ' + allOrders[idx].orderNo + '？此操作不可撤销。')) return;
    allOrders.splice(idx, 1); saveOrders(); renderTable(); showToast('订单已删除');
  };

  // ========== 导出 CSV ==========
  window.exportCSV = function() {
    const orders = getFiltered();
    if (!orders.length) { showToast('没有可导出的订单', true); return; }
    const BOM = '\uFEFF';
    const header = ['订单号','下单时间','收件人','手机号','地址','备注','商品明细','合计','状态'];
    const rows = orders.map(o => {
      const r = o.receiver || {};
      const itemsStr = (o.items || []).map(it => it.name + '×' + it.qty + '斤').join('、');
      return [o.orderNo||'', o.time||'', r.name||'', r.phone||'', r.addr||r.address||'', r.remark||'', itemsStr, parseFloat(o.total||0).toFixed(2), o.status||''];
    });
    const csvContent = BOM + [header, ...rows].map(row => row.map(c => '"' + (c||'').toString().replace(/"/g, '""') + '"').join(',')).join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = '荔枝订单_' + new Date().toISOString().split('T')[0] + '.csv';
    a.click(); URL.revokeObjectURL(url);
    showToast('已导出 ' + orders.length + ' 条订单');
  };

  // ========== Toast ==========
  function showToast(msg, isError) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error-toast' : '') + ' show';
    setTimeout(() => t.classList.remove('show'), 2500);
  }
  window.showToast = showToast;

  // ========== 价格管理 ==========
  async function loadPricesFromCloud() {
    const url = getPriceUrl();
    if (!url) return null;
    try {
      const res = await fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + '_t=' + Date.now());
      if (res.ok) { const d = await res.json(); if (d && d.guiwei) return d; }
    } catch(e) { console.warn('读取云端价格失败', e); }
    return null;
  }

  window.openPriceModal = function() {
    const tip = document.getElementById('priceTip');
    const url = getPriceUrl();
    if (url) {
      tip.textContent = '⏳ 正在从云端读取价格...';
      loadPricesFromCloud().then(data => {
        if (data) currentPrices = data;
        document.getElementById('priceGuiwei').value = currentPrices.guiwei ?? 49;
        document.getElementById('priceNuomici').value = currentPrices.nuomici ?? 68;
        document.getElementById('priceXianjinfeng').value = currentPrices.xianjinfeng ?? 58;
        tip.textContent = '💡 修改后点击保存，客户端刷新即自动同步。';
        document.getElementById('priceOverlay').classList.add('open');
      });
    } else {
      try { const d = JSON.parse(localStorage.getItem('lychee_prices')); if (d && d.guiwei) currentPrices = d; } catch(e) {}
      document.getElementById('priceGuiwei').value = currentPrices.guiwei ?? 49;
      document.getElementById('priceNuomici').value = currentPrices.nuomici ?? 68;
      document.getElementById('priceXianjinfeng').value = currentPrices.xianjinfeng ?? 58;
      tip.innerHTML = '⚠️ 未配置云端地址，价格仅保存到本地浏览器。<br>请参考代码第 418 行配置 Gist 或 Cloudflare Worker。';
      document.getElementById('priceOverlay').classList.add('open');
    }
  };

  window.closePriceModal = function() { document.getElementById('priceOverlay').classList.remove('open'); };

  window.savePrices = async function() {
    const btn = document.getElementById('priceSaveBtn');
    const tip = document.getElementById('priceTip');
    const prices = {
      guiwei: parseFloat(document.getElementById('priceGuiwei').value) || 0,
      nuomici: parseFloat(document.getElementById('priceNuomici').value) || 0,
      xianjinfeng: parseFloat(document.getElementById('priceXianjinfeng').value) || 0
    };
    localStorage.setItem('lychee_prices', JSON.stringify(prices));
    currentPrices = prices;

    btn.disabled = true;
    btn.textContent = '保存中…';

    const url = getPriceUrl();
    if (!url) {
      tip.innerHTML = '⚠️ 未配置云端地址，已保存到本地浏览器。<br>请参考代码第 418 行配置同步服务。';
      showToast('已保存到本地（仅当前浏览器）');
      btn.disabled = false; btn.textContent = '💾 保存价格';
      setTimeout(closePriceModal, 1500);
      return;
    }

    try {
      const res = await fetch(url, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(prices)
      });
      if (res.ok) {
        tip.innerHTML = '✅ 价格已保存到云端！客户端刷新页面即自动同步。';
        showToast('价格已保存到云端');
        setTimeout(closePriceModal, 1500);
      } else { throw new Error('保存失败'); }
    } catch(e) {
      tip.innerHTML = '❌ 云端保存失败，已保存到本地兜底。<br>原因：' + (e.message || '网络错误') + '<br>请检查地址是否正确，以及服务端是否支持 PUT。';
      showToast('云端保存失败，已本地保存', true);
    } finally {
      btn.disabled = false; btn.textContent = '💾 保存价格';
    }
  };

  // ========== 初始化 ==========
  (function init() {
    loadOrders();
    renderTable();
    document.getElementById('detailModal').addEventListener('click', function(e) { if (e.target === this) closeDetail(); });
    document.getElementById('priceOverlay').addEventListener('click', function(e) { if (e.target === this) closePriceModal(); });
  })();
})();
</script>
</body>
</html>
